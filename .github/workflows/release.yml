name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, master ancestry, and release notes
        run: |
          git merge-base --is-ancestor HEAD origin/master || {
            echo 'Release tag must point to a commit on master.' >&2
            exit 1
          }
          python3 scripts/release-contract.py --tag "$GITHUB_REF_NAME"

  linux:
    needs: validate
    uses: ./.github/workflows/linux.yml

  windows:
    needs: validate
    uses: ./.github/workflows/windows.yml

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download Linux package
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dynamicbrowser-linux-amd64
          path: release-assets
      - name: Download Windows package
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dynamicbrowser-windows-amd64
          path: release-assets
      - name: Publish packages and changelog excerpt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-contract.py --tag "$GITHUB_REF_NAME" \
            > release-notes.md
          version=${GITHUB_REF_NAME#v}
          linux="dynamicbrowser-$version-linux-amd64.tar.gz"
          windows="dynamicbrowser-$version-windows-amd64.zip"
          (cd release-assets
            sha256sum --strict -c "$linux.sha256" "$windows.sha256")
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" \
            --jq .sha)
          [[ "$tag_sha" == "$(git rev-parse HEAD)" ]] || {
            echo 'Release tag no longer points to the checked commit.' >&2
            exit 1
          }
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md \
            "release-assets/$linux" "release-assets/$linux.sha256" \
            "release-assets/$windows" "release-assets/$windows.sha256"
