name: Linux CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_NPM_PACKAGE_MANAGER: npm
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache_key_prefix: mise-npm-v1

      - name: Lint, validate specs, and test
        run: |
          mise exec -- golangci-lint run
          mise exec -- openspec validate --all --strict --no-interactive
          mise exec -- go test -race -timeout 5m ./...
          mise exec -- go vet ./...

      - name: Package and smoke-test Linux tarball
        run: mise exec -- bash scripts/package-linux.sh

      - name: Upload tarball and checksum
        # actions/upload-artifact v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dynamicbrowser-linux-amd64
          path: |
            dist/dynamicbrowser-*-linux-amd64.tar.gz
            dist/dynamicbrowser-*-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
