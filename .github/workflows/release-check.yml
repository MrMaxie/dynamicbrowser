name: Release contract

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    name: Check VERSION and changelog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release contract
        run: >-
          python3 -B -m unittest discover -s scripts
          -p 'test_release_contract.py'
      - name: Check proposed release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/release-contract.py --base "$BASE_SHA"
